name: Publish verified v0.1.2 beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.1.2-beta.1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v0.1.2-beta.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: vieiratechbr/claude-to-codex
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful build and unchanged application
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/38480138034 > build.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .head_sha == "35e52f4448c39c23abf4b574a17e53a1a2c6ff0a"' build.json
          gh api repos/$GH_REPO/actions/artifacts/11856073475 > artifact.json
          jq -e '.name == "Windows-installer" and .expired == false and .digest == "sha256:ae4b314f67ddb4264aea86335687f59e2faf5c498e5ed216cd1370e65cff16f1"' artifact.json
          git diff --exit-code 35e52f4448c39c23abf4b574a17e53a1a2c6ff0a HEAD -- src package.json package-lock.json scripts electron-builder.yml '*.config.ts' tests
      - uses: actions/download-artifact@v4
        with:
          name: Windows-installer
          path: release-assets
          github-token: ${{ github.token }}
          repository: vieiratechbr/claude-to-codex
          run-id: 38480138034
      - name: Prepare checksums and beta notes
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/Claude-to-Codex-0.1.2-beta.1-Windows-x64-Setup.exe
          (cd release-assets && sha256sum Claude-to-Codex-0.1.2-beta.1-Windows-x64-Setup.exe > SHA256SUMS.txt)
          cp docs/releases/v0.1.2-beta.1.md release-notes.md
          printf '\n## SHA-256 do instalador publicado\n\n```text\n' >> release-notes.md
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          printf '```\n' >> release-notes.md
      - name: Publish beta and preserve previous downloads
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2-beta.1 --json isDraft,isPrerelease,targetCommitish > existing-release.json 2>/dev/null; then
            if jq -e '.isDraft == false and .isPrerelease == true' existing-release.json >/dev/null; then
              echo 'Beta already published; preserving existing assets.'
            else
              jq -e --arg commit "$RELEASE_COMMIT" '.isDraft == true and .targetCommitish == $commit' existing-release.json
              gh release upload v0.1.2-beta.1 release-assets/Claude-to-Codex-0.1.2-beta.1-Windows-x64-Setup.exe release-assets/SHA256SUMS.txt --clobber
              gh release edit v0.1.2-beta.1 --draft=false --prerelease --latest=false --notes-file release-notes.md
            fi
          else
            gh release create v0.1.2-beta.1 --target "$RELEASE_COMMIT" --title 'Claude to Codex v0.1.2-beta.1 — Windows' --notes-file release-notes.md --draft --prerelease
            gh release upload v0.1.2-beta.1 release-assets/Claude-to-Codex-0.1.2-beta.1-Windows-x64-Setup.exe release-assets/SHA256SUMS.txt
            gh release edit v0.1.2-beta.1 --draft=false --prerelease --latest=false
          fi
          gh release view v0.1.1 --json body --jq .body > previous-notes.md
          printf '**Beta pública.** Esta versão pertence à fase de testes. Use a beta mais recente em [Releases](https://github.com/vieiratechbr/claude-to-codex/releases). Os downloads abaixo foram preservados.\n\n' > previous-beta-notes.md
          cat previous-notes.md >> previous-beta-notes.md
          gh release edit v0.1.1 --prerelease --latest=false --title 'Claude to Codex v0.1.1 — Beta Windows' --notes-file previous-beta-notes.md
          gh release view v0.1.2-beta.1 --json url,isDraft,isPrerelease,assets
