appId: br.com.vieiratech.claude-to-codex
productName: Claude to Codex
directories:
  output: release
files:
  - dist/main/index.cjs
  - dist/main/preload.cjs
  - dist/renderer/**/*
  - package.json
  - LICENSE
asar: true
win:
  icon: build/installer/app-icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Claude-to-Codex-${version}-Windows-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  installerLanguages: [pt_BR]
  include: build/installer/custom.nsh
  installerIcon: build/installer/app-icon.ico
  uninstallerIcon: build/installer/app-icon.ico
  installerHeader: build/installer/header.bmp
  installerSidebar: build/installer/sidebar.bmp
  uninstallerSidebar: build/installer/sidebar.bmp
